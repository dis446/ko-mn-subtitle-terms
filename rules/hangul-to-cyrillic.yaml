# Hangul → Mongolian Cyrillic transliteration rules
#
# WHY THIS FILE EXISTS
# There is no national standard for rendering foreign names into Mongolian Cyrillic.
# The National Council on Language Policy (ХБҮЗ) stated in October 2025 that
# "гадаад үг, нэр томьёо, оноосон нэрийг монгол хэлнээ буулгах тогтсон дүрэм,
#  стандарт байхгүй" — no established rule or standard exists.
# MNS 5217:2012 is Cyrillic → Latin romanisation, the wrong direction.
#
# So this file IS the convention. It is deterministic, testable, and versioned.
# It is not "correct" by authority — it is correct by being consistent and by
# every mapping having a stated phonetic reason. Where Mongolian usage exists
# (press and mn.wikipedia forms of Korean names: Сөүл, Тэгү, Жэжү, Мүн Жэ Ин,
# Юн Сок Ёл, Ким Жон Ун, Пак Гын Хе) it was used as corroboration, never as
# the authority.
#
# THE TWO MONGOLIAN FACTS THE WHOLE TABLE RESTS ON
#   1. Mongolian б/д/г are voiceless UNASPIRATED, п/т/к are ASPIRATED. The
#      Mongolian stop contrast is aspiration, not voicing.
#   2. Mongolian у = [ʊ], ү = [u]; о = [ɔ], ө = [o]; э = [e]; е = [je];
#      ы occurs only after a consonant; word-final н is read [ŋ].
#
# Everything here was checked against real Korean dialogue (The Remarried
# Empress S01E01-E04 subtitle tracks). See tests/corpus.yaml — every rule has
# at least one case there.

version: 2
description: >
  Syllable-level Hangul to Mongolian Cyrillic mapping. Composable: any of the
  11,172 modern Hangul syllables transliterates from these tables, so new shows
  need no new name entries — only exceptions.

# ── Initial consonants (초성, 19) ────────────────────────────────────────────
# Value used medially. Word-initial and contextual variants are in rules:.
initials:
  ㄱ: г        # medial lenis: voiced after vowels/sonorants, tense-unaspirated
  ㄲ: кк       #   after obstruents — both unaspirated, so Mongolian г
  ㄴ: н
  ㄷ: д
  ㄸ: тт
  ㄹ: р        # onset ㄹ is a tap [ɾ]
  ㅁ: м
  ㅂ: б
  ㅃ: пп
  ㅅ: с        # → ш before i/y; see rules.palatalisation
  ㅆ: сс
  ㅇ: ""       # silent placeholder, carries no consonant
  ㅈ: ж        # Mongolian usage: Жэ, Жон, Жэжү
  ㅉ: жж
  ㅊ: ч
  ㅋ: к        # aspirated → aspirated
  ㅌ: т
  ㅍ: п
  ㅎ: х        # Mongolian has no [h]; х is the universal choice

# ── Vowels (중성, 21) ───────────────────────────────────────────────────────
vowels:
  ㅏ: а
  ㅐ: э        # ㅐ and ㅔ have merged to [e] in modern Korean → one letter
  ㅑ: я
  ㅒ: е        # [je]; Mongolian е is iotated
  ㅓ: о        # [ʌ~ɔ] → о [ɔ]. Юн Сок Ёл, Жон, Инчон. (Сөүл is a lexicalised exonym)
  ㅔ: э        # v2: was е. Mongolian е is [je]; after a consonant [e] is э (Жэжү, Тэгү)
  ㅕ: ё
  ㅖ: е        # [je] → е (Пак Гын Хе)
  ㅗ: о        # merges with ㅓ — Mongolian has no letter pair that keeps
               #   [ʌ]/[o] apart without breaking every established form
  ㅘ: ва
  ㅙ: вэ
  ㅚ: вэ       # modern [we]
  ㅛ: ё
  ㅜ: ү        # v2: was у. Korean ㅜ is [u] = Mongolian ү, not у [ʊ].
               #   Mongolian usage agrees: Сөүл, Мүн, Тэгү, Жэжү, Пүсань, Үлсан
  ㅝ: во
  ㅞ: вэ       # v2: was ве — consistency with ㅔ → э
  ㅟ: ви
  ㅠ: ю
  ㅡ: ы        # after a consonant; see rules.eu_vowel_initial / epenthetic_eu
  ㅢ: ый       # see rules.ui_vowel
  ㅣ: и

# ── Final consonants (종성, 28) ─────────────────────────────────────────────
# Korean neutralises every coda to one of seven unreleased sounds
# [k̚ n t̚ l m p̚ ŋ]. `finals` is that neutralised value, used word-finally and
# before a consonant. `finals_before_vowel` is used when the next syllable is
# vowel-initial (ㅇ onset): the coda is then pronounced as the next onset.
finals:
  "": ""
  ㄱ: к        # 박 → Пак (unreleased voiceless; universal Mongolian usage)
  ㄲ: к
  ㄳ: к
  ㄴ: н
  ㄵ: н
  ㄶ: н
  ㄷ: т        # v2: was д word-finally — inconsistent with ㄱ → к
  ㄹ: л        # v2: word-final is plain л, never ль (Юн Сок Ёл, Сөүл).
               #   Mongolian ль is palatalised [lʲ]; the Korean coda is not.
  ㄺ: к
  ㄻ: м
  ㄼ: л
  ㄽ: л
  ㄾ: л
  ㄿ: п
  ㅀ: л
  ㅁ: м
  ㅂ: п        # v2: was б word-finally
  ㅄ: п
  ㅅ: т        # v2: was с. Coda ㅅ is [t̚]; loanwords spell final -t with ㅅ (로봇 → Робот)
  ㅆ: т
  ㅇ: н        # [ŋ]; Mongolian word-final н is itself read [ŋ]: 강 → Кан
  ㅈ: т
  ㅊ: т
  ㅋ: к
  ㅌ: т
  ㅍ: п
  ㅎ: ""

finals_before_vowel:
  "": ""
  ㄱ: г        # 한국어 → Хангуго (liaison, voiced)
  ㄲ: кк
  ㄳ: кс
  ㄴ: н
  ㄵ: нж       # 앉아 → Анжа
  ㄶ: н
  ㄷ: д
  ㄹ: л        # kept as the spelled coda for readability; not re-flapped
  ㄺ: лг
  ㄻ: лм
  ㄼ: лб
  ㄽ: лс
  ㄾ: лт
  ㄿ: лп
  ㅀ: р
  ㅁ: м
  ㅂ: б
  ㅄ: пс
  ㅅ: с
  ㅆ: сс
  ㅇ: н
  ㅈ: ж
  ㅊ: ч
  ㅋ: к
  ㅌ: т
  ㅍ: п
  ㅎ: ""

# ── Contextual rules ────────────────────────────────────────────────────────
rules:
  # Word-initial Korean lenis ㄱ/ㄷ/ㅂ has long VOT in modern Seoul speech (the
  # lenis/aspirated contrast has moved to pitch), so a Mongolian ear — which
  # sorts stops by aspiration — hears к/т/п. Everywhere else the lenis stop is
  # unaspirated (voiced after vowels/sonorants, tensed after obstruents), and
  # unaspirated is exactly what Mongolian г/д/б are.
  #   김 → Ким, 부산 → Пүсан, 박근혜 → Пакгынхе (press: Пак Гын Хе)
  # v2: post-obstruent stops were к/т/п; now г/д/б (tense = unaspirated).
  stop_voicing:
    enabled: true
    word_initial:   {ㄱ: к, ㄷ: т, ㅂ: п}
    elsewhere:      {ㄱ: г, ㄷ: д, ㅂ: б}

  # v2 NEW. Mongolian orthography has no word-initial geminates, so a tense
  # consonant at the start of a word is written single. Medially the doubling
  # stays (오빠 → Оппа — the form Mongolian K-pop fans already use).
  tense_initial:
    enabled: true
    map: {ㄲ: к, ㄸ: т, ㅃ: п, ㅆ: с, ㅉ: ж}

  # ㅅ/ㅆ are alveolo-palatal before i/y in Korean, and Mongolian has ш for it.
  # The y-glide is absorbed by the hushing consonant: 샤 → ша, not шя.
  # v2: ㅆ → ш (was щ: Mongolian reads щ as [ʃtʃ], a sound Korean never has);
  #     ㅖ/ㅒ added as triggers (셰프 → Шэп).
  palatalisation:
    enabled: true
    triggers: [ㅑ, ㅕ, ㅛ, ㅠ, ㅣ, ㅖ, ㅒ]
    map:
      ㅅ: ш
      ㅆ: ш
    vowel_map: {ㅑ: а, ㅕ: о, ㅛ: о, ㅠ: ү, ㅣ: и, ㅖ: э, ㅒ: э}

  # v2 NEW. Korean does not pronounce the y-glide after ㅈ/ㅉ/ㅊ (standard
  # pronunciation rule 5: 져 [저], 쳐 [처]), so it is not written: 가져 → Кажо.
  affricate_glide_absorption:
    enabled: true
    consonants: [ㅈ, ㅉ, ㅊ]
    vowel_map: {ㅑ: а, ㅕ: о, ㅛ: о, ㅠ: ү, ㅖ: э, ㅒ: э}

  # Korean inserts ㅡ to break up consonant clusters in foreign-style names
  # (Korean phonotactics forbid them; Mongolian loanword spelling permits
  # them). An open Cㅡ syllable is dropped to its bare consonant.
  #   라스타 → Раста   코샤르 → Кошар   서즈 → Сож
  # v2: now also word-initially when another syllable follows
  #   (크리스타 → Криста, 트로비 → Троби). Safe because Sino-Korean has no
  #   open ㅡ syllables at all, so name syllables are never hit. A lone Cㅡ
  #   word keeps its vowel (그 → Кы). Native-Korean words with a real ㅡ
  #   (그루) are the known casualty — they go to works/ as exceptions.
  epenthetic_eu:
    enabled: true
    word_initial_if_followed: true

  # v2 NEW. Korean loanword spelling writes a C+l cluster as Cㅡㄹ + ㄹV
  # (클라라 Clara, 블루 blue, 부틀린 Botulin): the ㅡ is epenthetic and ㄹㄹ is
  # a single [l]. Same mechanism as epenthetic_eu, applied to the one case
  # where the epenthetic syllable carries a coda.
  #   부틀린 → Пүтлин (v1 gave Путыллин)   클라라 → Клара
  cluster_eu_l:
    enabled: true

  # v2 NEW. Mongolian ы only ever follows a consonant. Vowel-initial ㅡ (은, 으)
  # is written у: [ɯ] is a back high vowel and у [ʊ] is the nearest Mongolian
  # one. This also keeps 은 (у) apart from 운 (ү), and stops 정은 reading as
  # the genitive "Жонын". Matches the universal Mongolian form Ким Жон Ун.
  eu_vowel_initial:
    enabled: true
    value: у

  # v2 NEW. ㅢ is [ɰi] only without a consonant onset; after a consonant it is
  # [i] (standard pronunciation rule 5: 희 [히]). Vowel-initial: уй, by the
  # same reasoning as eu_vowel_initial.
  ui_vowel:
    enabled: true
    after_consonant: и
    vowel_initial: уй

  # и + э at a syllable seam is written ие (Mongolian spells [ie] with е):
  # 나비에 → Набие.
  seam_i_e:
    enabled: true

  # OFF: ㄴ+ㄹ / ㄹ+ㄴ assimilation is native-Korean sandhi (신라 → 실라) but it
  # corrupts the foreign-style names this engine mostly serves: 하인리 must
  # stay Хаинри. The written form is what the viewer can match to the name.
  liquid_assimilation:
    enabled: false

  # OFF: 박물관 [방물관]. Spelled forms stay recognisable; documented choice.
  nasalisation:
    enabled: false

# ── Presentation ────────────────────────────────────────────────────────────
presentation:
  capitalise_first_letter: true
  # Korean personal names (--name): Mongolian usage writes every syllable as a
  # separate capitalised word (Ким Жон Ун, Мүн Жэ Ин), but the sound rules are
  # computed across the whole name, so 박근혜 → Пак Гын Хе, not Пак Кын Хе.
  # Because each syllable is then a written word, codas take their word-final
  # form: 윤석열 → Юн Сок Ёл (not Сог).
  name_mode_space_syllables: true
